name: Package rehearsal candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_only_harness:
        description: 'Verify the PR368 test closure against its original artifact without rebuilding product'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: package-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr368-harness:
    if: inputs.test_only_harness == true || github.head_ref == 'candidate/pr368-installed-journey-test' || github.head_ref == 'candidate/pr368-acceptance-supplement'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - name: Require a test-only successor of frozen PR368
        run: |
          set -euo pipefail
          base=018f4aa10a52c1122f0f045063034dbef05e9d05
          git merge-base --is-ancestor "$base" HEAD
          while IFS= read -r file; do
            case "$file" in
              test/*|docs/research/pr368-installed-journey.md|.github/workflows/package-candidate.yml) ;;
              *) echo "Unexpected product change: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$base" HEAD)
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Admit the existing PR368 archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/pr368-harness"
          mkdir -p "$RUNNER_TEMP/pr368-original"
          gh run download 37586208412 --repo AshleyHollis/openclaw-command-center \
            --name command-center-candidate-018f4aa10a52c1122f0f045063034dbef05e9d05 --dir "$RUNNER_TEMP/pr368-original"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFile } from 'node:fs/promises';
          import { verifyPluginArtifact } from './src/plugin-artifact.mjs';
          import { resolveRealHostAcceptancePlan } from './src/test-selection.mjs';
          assert.deepEqual(resolveRealHostAcceptancePlan('topic-notes-visual').scenarioIds, ['native-topic-files-workspace']);
          const parent = process.env.RUNNER_TEMP;
          const receipt = JSON.parse(await readFile(`${parent}/pr368-original/receipt.json`, 'utf8'));
          assert.equal(receipt.sourceCommit, '018f4aa10a52c1122f0f045063034dbef05e9d05');
          assert.equal(receipt.buildDigest, '9faf423fd7d2702a108e28fb7cd9fe8324177a5a1e4d2a4b169dde9e75e0e7c2');
          assert.equal(receipt.archive.sha256, '9a2a793da18a1f04180cae36e280f8d2846d69710945efa593c5264f20a7a444');
          await verifyPluginArtifact({ archivePath: `${parent}/pr368-original/command-center.tgz`, expectedReceipt: receipt, destinationDirectory: `${parent}/pr368-harness/verified` });
          NODE
          echo "COMMAND_CENTER_NATIVE_UI_ROOT=$RUNNER_TEMP/pr368-harness/verified/dist/native-ui" >> "$GITHUB_ENV"
      - name: Exercise existing explicit browser binding with an empty managed cache
        run: |
          set -euo pipefail
          # Reuse the browser this workflow provisioned above. System Chromium
          # is a separate runner dependency and can stall before DevTools opens.
          browser=$(node --input-type=module -e "import { chromium } from 'playwright'; console.log(chromium.executablePath())")
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH="$browser" node --test --test-concurrency=1 test/managed-browser-executable.test.mjs
      - name: Exercise the coherent asynchronous packaged-UI diagnostic
        run: node --test test/everyday-installed-driver.test.mjs
      - name: Verify private bounded failed-page evidence mechanics
        run: node --test test/native-journey-diagnostics.test.mjs
      - name: Retain existing picker dialog reader and navigation contracts
        run: node --test --test-concurrency=1 test/native-topic-assignment.test.mjs test/native-topic-creation-dialog.test.mjs test/native-topic-sidebar.test.mjs test/native-reader-tables.test.mjs test/native-reader-workspace.test.mjs test/native-document-preview.test.mjs test/native-ui-navigation.test.mjs test/mutation-architecture.test.mjs
      - run: node scripts/check.mjs
      - name: Record proof boundaries
        run: echo 'Original product018f4aa artifact reused. Supplemental contract diagnostic only; original f60 desktop proof passed. Supplement installed checks, actual Android and full native browser UI200%zoom remain unproved.' >> "$GITHUB_STEP_SUMMARY"
  package:
    if: inputs.test_only_harness != true && github.head_ref != 'candidate/pr368-installed-journey-test' && github.head_ref != 'candidate/pr368-acceptance-supplement'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned candidate dependencies
        run: |
          set -euo pipefail
          dependencies="$RUNNER_TEMP/candidate-dependencies"
          mkdir -p "$dependencies"
          cp package.json package-lock.json "$dependencies/"
          npm ci --prefix "$dependencies" --ignore-scripts --no-audit --no-fund
      # Fixed packaging toolchain only; this is not the deployed host identity.
      # No credentials, live mounts or network are passed to candidate commands.
      - name: Build and verify candidate archive
        env:
          TOOLCHAIN: ghcr.io/ashleyhollis/openclaw@sha256:1154a8fdd314ddf2e87be56f8e33eef78c7bd2eb93d3bd325723d4e9ca03d9c0
          COMMAND_CENTER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          docker pull "$TOOLCHAIN"
          sudo install -d -o 10001 -g 10001 -m 0700 "$RUNNER_TEMP/candidate-package"
          # The interruption fixture executes a temporary npm wrapper. Exec is
          # confined to this networkless test container, not an import profile.
          docker run --rm --init --network none --read-only \
            --env COMMAND_CENTER_SOURCE_COMMIT \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 8g --pids-limit 256 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1073741824,mode=1777 \
            --mount "type=tmpfs,dst=/workspace,tmpfs-size=1073741824,tmpfs-mode=1777" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/candidate,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate-dependencies/node_modules,dst=/workspace/node_modules,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate-package,dst=/output" \
            --entrypoint /bin/sh "$TOOLCHAIN" -eu -c '
              cp -R /candidate/. /workspace/
              cd /workspace
              node --test test/conversation-creation.test.mjs test/topic-page-http.test.mjs test/topic-conversation-assignment.test.mjs test/native-ui-navigation.test.mjs test/mutation-architecture.test.mjs
              node --test test/plugin-artifact.test.mjs test/note-folder-identity-migration.test.mjs \
                test/historical-backfill-operator.test.mjs test/historical-backfill.test.mjs \
                test/historical-backfill-store.test.mjs test/reconcile-cli.test.mjs
              node scripts/package-candidate.mjs --output /output/artifact
            '
          # Container output is private to its UID until the child has exited.
          # Transfer directory access before inspecting the fixed output files.
          sudo chown --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/candidate-package"
          test -d "$RUNNER_TEMP/candidate-package/artifact"
          test ! -L "$RUNNER_TEMP/candidate-package/artifact"
          sudo chown --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/candidate-package/artifact"
          for member in command-center.tgz receipt.json; do
            file="$RUNNER_TEMP/candidate-package/artifact/$member"
            test -f "$file" && test ! -L "$file"
            test "$(stat -c %h "$file")" = 1
            sudo chown --no-dereference "$(id -u):$(id -g)" "$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: command-center-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/candidate-package/artifact/command-center.tgz
            ${{ runner.temp }}/candidate-package/artifact/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Record qualification boundary
        run: |
          printf '%s\n' 'Candidate archive only. Matching-host rehearsal, performance, coherent acceptance and independent evaluation remain required before deployment.' >> "$GITHUB_STEP_SUMMARY"
