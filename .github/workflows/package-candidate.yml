name: Package rehearsal candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-candidate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0
      - name: Install pinned candidate dependencies
        run: |
          set -euo pipefail
          dependencies="$RUNNER_TEMP/candidate-dependencies"
          mkdir -p "$dependencies"
          cp package.json package-lock.json "$dependencies/"
          npm ci --prefix "$dependencies" --ignore-scripts --no-audit --no-fund
      - name: Reuse exact pinned native SDK artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sdk="$RUNNER_TEMP/pinned-native-sdk"
          mkdir -p "$sdk/download" "$sdk/runtime"
          NATIVE_RUN=37873292633
          NATIVE_ARTIFACT=nas-runtime-package-ea4135dbeced9c393ab4f6ebde8bf3e751ea5fa2-37873292633-1
          NATIVE_SHA256=acf8cd1cedd1b64f6b855c7177fd3340a03208cd9cbf30aeaf5a511d2e2ef470
          expected_native=ea4135dbeced9c393ab4f6ebde8bf3e751ea5fa2
          echo 'COMMAND_CENTER_TEST_NATIVE_ATTACHMENT_ADMISSION=1' >> "$GITHUB_ENV"
          gh run download "$NATIVE_RUN" --repo AshleyHollis/openclaw \
            --name "$NATIVE_ARTIFACT" \
            --dir "$sdk/download"
          printf '%s  %s\n' "$NATIVE_SHA256" \
            "$sdk/download/openclaw-current.tgz" | sha256sum --check --strict
          python3 -c 'import json,sys; receipt=json.load(open(sys.argv[1])); assert receipt["packageSourceSha"] == sys.argv[2]; assert receipt["sha256"] == sys.argv[3]' \
            "$sdk/download/package-candidate.json" "$expected_native" "$NATIVE_SHA256"
          tar -xzf "$sdk/download/openclaw-current.tgz" -C "$sdk/runtime"
          mkdir -p "$sdk/runtime/node_modules"
      # Fixed packaging toolchain only; this is not the deployed host identity.
      # No credentials, live mounts or network are passed to candidate commands.
      - name: Build and verify candidate archive
        env:
          TOOLCHAIN: ghcr.io/ashleyhollis/openclaw@sha256:1154a8fdd314ddf2e87be56f8e33eef78c7bd2eb93d3bd325723d4e9ca03d9c0
          COMMAND_CENTER_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          node_toolchain="$(command -v node)"
          test "$(node --version)" = v24.21.0
          docker pull "$TOOLCHAIN"
          sudo install -d -o 10001 -g 10001 -m 0700 "$RUNNER_TEMP/candidate-package"
          # The interruption fixture executes a temporary npm wrapper. Exec is
          # confined to this networkless test container, not an import profile.
          docker run --rm --init --network none --read-only \
            --env COMMAND_CENTER_SOURCE_COMMIT \
            --env COMMAND_CENTER_TEST_NATIVE_ATTACHMENT_ADMISSION \
            --env COMMAND_CENTER_NATIVE_PLAN_SDK=/native-sdk/package/dist/plugin-sdk/session-transcript-runtime.js \
            --env COMMAND_CENTER_TEST_SQLITE_RUNTIME=file:///native-sdk/package/dist/plugin-sdk/sqlite-runtime.js \
            --env COMMAND_CENTER_TEST_FILE_ACCESS_RUNTIME=file:///native-sdk/package/dist/plugin-sdk/file-access-runtime.js \
            --env COMMAND_CENTER_TEST_SESSION_STORE_RUNTIME=file:///native-sdk/package/dist/plugin-sdk/session-store-runtime.js \
            --env COMMAND_CENTER_TEST_SESSION_TRANSCRIPT_RUNTIME=file:///native-sdk/package/dist/plugin-sdk/session-transcript-runtime.js \
            --env NODE_OPTIONS=--import=/workspace/test/fixtures/note-runtime-loader.mjs \
            --mount "type=bind,src=$RUNNER_TEMP/pinned-native-sdk/runtime,dst=/native-sdk,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate-dependencies/node_modules,dst=/native-sdk/node_modules,readonly" \
            --user 10001:10001 --cap-drop ALL --security-opt no-new-privileges \
            --cpus 2 --memory 8g --pids-limit 256 \
            --tmpfs /tmp:rw,exec,nosuid,nodev,size=1073741824,mode=1777 \
            --mount "type=tmpfs,dst=/workspace,tmpfs-size=1073741824,tmpfs-mode=1777" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/candidate,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate-dependencies/node_modules,dst=/workspace/node_modules,readonly" \
            --mount "type=bind,src=$node_toolchain,dst=/usr/local/bin/node,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/candidate-package,dst=/output" \
            --entrypoint /bin/sh "$TOOLCHAIN" -eu -c '
              cp -R /candidate/. /workspace/
              cd /workspace
              test "$(node --version)" = v24.21.0
              node --test test/enabled-feature-candidate.test.mjs
              node --test test/conversation-creation.test.mjs test/topic-page-http.test.mjs test/topic-conversation-assignment.test.mjs test/native-ui-navigation.test.mjs test/mutation-architecture.test.mjs
              node --test test/conversation-plans.test.mjs test/conversation-plan-source.test.mjs test/conversation-plan-attention.test.mjs test/conversation-plan-native-contract.test.mjs
              node --test test/native-attachment-selection.test.mjs test/native-attachment-sdk.test.mjs test/topic-document-filing-review.test.mjs test/topic-document-filing-intent.test.mjs test/topic-document-filing.test.mjs test/topic-document-filing-recovery.test.mjs test/note-process-death.test.mjs test/mutation-reconciliation.test.mjs test/mutation-architecture.test.mjs
              if [ "${COMMAND_CENTER_TEST_NATIVE_ATTACHMENT_ADMISSION:-}" = 1 ]; then
                node --test test/topic-document-filing-native-admission.test.mjs
              fi
              node --test test/plugin-artifact.test.mjs test/note-folder-identity-migration.test.mjs \
                test/historical-backfill-operator.test.mjs test/historical-backfill.test.mjs \
                test/historical-backfill-store.test.mjs test/reconcile-cli.test.mjs
              node --test test/compatibility.test.mjs test/storage-migrations.test.mjs \
                test/schema-compatibility.test.mjs test/native-compatibility-fixture.test.mjs \
                test/harness.test.mjs
              node scripts/package-candidate.mjs --output /output/artifact
            '
          # Container output is private to its UID until the child has exited.
          # Transfer directory access before inspecting the fixed output files.
          sudo chown --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/candidate-package"
          test -d "$RUNNER_TEMP/candidate-package/artifact"
          test ! -L "$RUNNER_TEMP/candidate-package/artifact"
          sudo chown --no-dereference "$(id -u):$(id -g)" "$RUNNER_TEMP/candidate-package/artifact"
          for member in command-center.tgz receipt.json; do
            file="$RUNNER_TEMP/candidate-package/artifact/$member"
            test -f "$file" && test ! -L "$file"
            test "$(stat -c %h "$file")" = 1
            sudo chown --no-dereference "$(id -u):$(id -g)" "$file"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: command-center-candidate-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/candidate-package/artifact/command-center.tgz
            ${{ runner.temp }}/candidate-package/artifact/receipt.json
          if-no-files-found: error
          retention-days: 14
      - name: Record qualification boundary
        run: |
          printf '%s\n' 'Candidate archive only. Matching-host rehearsal, performance, coherent acceptance and independent evaluation remain required before deployment.' >> "$GITHUB_STEP_SUMMARY"
