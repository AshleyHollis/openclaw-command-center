name: Qualify Command Center release

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Optional focused acceptance scenario; blank runs the complete release qualification
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: read

concurrency:
  group: qualify-command-center-release-${{ github.ref }}-${{ inputs.scenario || 'release' }}
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: ${{ fromJSON(inputs.scenario == '' && '["native-release-prerequisites","scale-performance"]' || format('[{0}]', toJSON(inputs.scenario))) }}
    env:
      IMAGE: ghcr.io/ashleyhollis/openclaw@sha256:714d71199e498398a75e519b4ef3e19154eb48950a9185391b89aa34896d5980
      OPENCLAW_COMMIT: 21f1ca697532a9bd9e9cc46322a598a31435de15
      OPENCLAW_VERSION: 2026.9.5
      COMMAND_CENTER_CONTROLLER_SOURCE_ROOT: ${{ github.workspace }}/_openclaw-source
      COMMAND_CENTER_ACCEPTANCE_SCENARIO: ${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Install the supported Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm

      - name: Configure browser cache
        run: printf 'PLAYWRIGHT_BROWSERS_PATH=%s/ms-playwright\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Checkout exact OpenClaw source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: AshleyHollis/openclaw
          ref: 21f1ca697532a9bd9e9cc46322a598a31435de15
          fetch-depth: 1
          persist-credentials: false
          path: _openclaw-source

      - name: Install sealed candidate and browser dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx playwright install --with-deps chromium
          npm run build

      - name: Prepare disposable Btrfs acceptance storage
        run: |
          set -euo pipefail
          if ! command -v mkfs.btrfs >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes btrfs-progs
          fi
          image="$RUNNER_TEMP/command-center-acceptance.btrfs"
          mountpoint="$RUNNER_TEMP/command-center-acceptance"
          truncate --size=4G "$image"
          mkfs.btrfs --quiet --force "$image"
          mkdir -p "$mountpoint"
          sudo mount -o loop "$image" "$mountpoint"
          sudo chown "$(id -u):$(id -g)" "$mountpoint"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$mountpoint" "$mountpoint" "$mountpoint" >> "$GITHUB_ENV"

      - name: Materialize authenticated host descriptor
        run: |
          set -euo pipefail
          docker pull "$IMAGE"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")" = "$OPENCLAW_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE")" = "$OPENCLAW_VERSION"

          host="$RUNNER_TEMP/command-center-host"
          mkdir -p "$host/checkout" "$host/runtime"
          tar --exclude=.git -C _openclaw-source -cf - . | tar --no-same-owner -C "$host/checkout" -xf -
          cp -a _openclaw-source/.git "$host/checkout/.git"
          git -C "$host/checkout" rev-parse HEAD | grep -Fx "$OPENCLAW_COMMIT"
          test -z "$(git -C "$host/checkout" status --porcelain --untracked-files=no)"
          git -C _openclaw-source archive --format=tar "$OPENCLAW_COMMIT" > "$RUNNER_TEMP/openclaw-source.tar"
          printf 'sha256:%s\n' "$(sha256sum "$RUNNER_TEMP/openclaw-source.tar" | cut -d ' ' -f 1)" > "$RUNNER_TEMP/source-digest.txt"

          container="$(docker create "$IMAGE")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/." "$host/runtime"
          docker rm "$container" >/dev/null
          trap - EXIT
          sudo chown -R "$(id -u):$(id -g)" "$host"

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile, appendFile } from 'node:fs/promises';
          import path from 'node:path';
          import { parseHostDescriptor, pinnedHost, verifyHost } from './src/host-harness.mjs';
          import { packagedHostDigest } from './src/packaged-host-integrity.mjs';
          import { releasePerformanceIdentity } from './src/performance-baseline.mjs';

          const digest = bytes => `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          const host = path.join(process.env.RUNNER_TEMP, 'command-center-host');
          const checkout = path.join(host, 'checkout');
          const runtimeRoot = path.join(host, 'runtime');
          const receipt = {
            schemaVersion: 2,
            sourceDigest: (await readFile(path.join(process.env.RUNNER_TEMP, 'source-digest.txt'), 'utf8')).trim(),
            commit: pinnedHost.commit,
            executableDigest: digest(await readFile(path.join(runtimeRoot, 'node_modules/openclaw/openclaw.mjs'))),
            contractDigest: digest(Buffer.from(JSON.stringify(JSON.parse(await readFile('src/runtime-capability.json', 'utf8'))))),
            packageDigest: pinnedHost.packageDigest,
            runtimeDigest: await packagedHostDigest(runtimeRoot)
          };
          if (JSON.stringify(receipt) !== JSON.stringify(releasePerformanceIdentity.hostReceipt)) throw new Error('Prepared host receipt differs from the frozen performance identity');
          await writeFile(path.join(host, 'receipt.json'), `${JSON.stringify(receipt)}\n`, { mode: 0o400 });
          const descriptor = {
            schemaVersion: 2,
            checkout,
            runtimeRoot,
            commit: pinnedHost.commit,
            command: { executable: 'node_modules/openclaw/openclaw.mjs', args: pinnedHost.args },
            integrity: receipt
          };
          await verifyHost(parseHostDescriptor(JSON.stringify(descriptor)));
          await appendFile(process.env.GITHUB_ENV, `COMMAND_CENTER_ISOLATED_HOST=${JSON.stringify(descriptor)}\n`);
          NODE

      - name: Run coherent native release qualification
        env:
          COMMAND_CENTER_SEALED_CANDIDATE: "1"
          COMMAND_CENTER_RELEASE_MAX_CONCURRENCY: "1"
        run: |
          set -euo pipefail
          first="$RUNNER_TEMP/qualification-attempt-1.log"
          set +e
          node --test --test-isolation=none test/real-host.acceptance.test.mjs 2>&1 | tee "$first"
          first_status="${PIPESTATUS[0]}"
          set -e
          if [ "$first_status" -eq 0 ]; then
            if [ "$COMMAND_CENTER_ACCEPTANCE_SCENARIO" != "scale-performance" ] ||
              node scripts/validate-scale-qualification-log.mjs "$first"; then
              cp "$first" "$RUNNER_TEMP/qualification.log"
              exit 0
            fi
            retry_reason=performance-budget
          else
            if [ "$COMMAND_CENTER_ACCEPTANCE_SCENARIO" != "scale-performance" ] ||
              [ "$(grep -cF 'acceptance-scenario-failure=' "$first")" -ne 1 ] ||
              [ "$(grep -cF '"category":"readiness-timeout"' "$first")" -lt 1 ] ||
              [ "$(grep -oE '"category":"[^"]+"' "$first" | grep -vcF '"category":"readiness-timeout"' || true)" -ne 0 ] ||
              [ "$(grep -cE 'acceptance-finalization=.*"status":"started"' "$first")" -ne 6 ] ||
              [ "$(grep -cE 'acceptance-finalization=.*"status":"passed"' "$first")" -ne 6 ]; then
              exit "$first_status"
            fi
            retry_reason=readiness-timeout
          fi
          if [ "$(grep -cE 'acceptance-finalization=.*"status":"started"' "$first")" -ne 6 ] ||
            [ "$(grep -cE 'acceptance-finalization=.*"status":"passed"' "$first")" -ne 6 ]; then
            printf '%s\n' 'The first scale attempt did not complete cleanup; refusing retry.' >&2
            exit 1
          fi
          printf 'The first scale attempt hit %s after complete cleanup; running the one permitted audited retry.\n' "$retry_reason" >> "$GITHUB_STEP_SUMMARY"
          node --test --test-isolation=none test/real-host.acceptance.test.mjs 2>&1 | tee "$RUNNER_TEMP/qualification.log"
          node scripts/validate-scale-qualification-log.mjs "$RUNNER_TEMP/qualification.log"

      - name: Remove disposable Btrfs acceptance storage
        if: always()
        run: |
          set -euo pipefail
          mountpoint="$RUNNER_TEMP/command-center-acceptance"
          if mountpoint -q "$mountpoint"; then sudo umount "$mountpoint"; fi

      - name: Seal qualification slice
        if: inputs.scenario == ''
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { mkdir, readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { readBuiltReceipt } from './src/build.mjs';
          import { scanPublicEvidence } from './src/safety.mjs';

          const scenario = process.env.COMMAND_CENTER_ACCEPTANCE_SCENARIO;
          const marker = scenario === 'native-release-prerequisites' ? 'acceptance-prerequisites=' : 'acceptance-scenario-result=';
          const log = await readFile(path.join(process.env.RUNNER_TEMP, 'qualification.log'), 'utf8');
          const lines = log.split(/\r?\n/u).filter(line => line.includes(marker));
          assert.equal(lines.length, 1, 'qualification slice must emit one canonical completion receipt');
          const evidence = JSON.parse(lines[0].slice(lines[0].indexOf(marker) + marker.length));
          const build = await readBuiltReceipt();
          assert.equal(evidence.buildDigest, build.digest);
          if (scenario === 'native-release-prerequisites') {
            assert.equal(evidence.kind, 'native-release-prerequisites');
            assert.equal(evidence.performanceQualified, false);
          } else {
            assert.equal(evidence.outcome, 'passed');
            assert.equal(evidence.scenario, 'scale-performance');
            assert.deepEqual(evidence.scenarioIds, ['scale-performance']);
            assert.equal(evidence.performanceQualified, false);
          }
          const finalizationMarker = 'acceptance-finalization=';
          const finalization = scenario === 'scale-performance' ? log.split(/\r?\n/u)
            .filter(line => line.includes(finalizationMarker))
            .map(line => JSON.parse(line.slice(line.indexOf(finalizationMarker) + finalizationMarker.length))) : undefined;
          const receipt = {
            schemaVersion: 1,
            kind: 'command-center-release-qualification-slice',
            scenario,
            sourceCommit: process.env.GITHUB_SHA,
            workflowRun: process.env.GITHUB_RUN_ID,
            hostImage: process.env.IMAGE,
            buildDigest: build.digest,
            evidence,
            ...(finalization ? { finalization } : {})
          };
          scanPublicEvidence([JSON.stringify(receipt)], { label: 'qualification-slice-receipt' });
          const output = path.join(process.env.RUNNER_TEMP, 'qualification-slice');
          await mkdir(output, { recursive: true });
          await writeFile(path.join(output, `${scenario}.json`), `${JSON.stringify(receipt, null, 2)}\n`, { flag: 'wx' });
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.scenario == ''
        with:
          name: command-center-release-slice-${{ matrix.scenario }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-slice/${{ matrix.scenario }}.json
          if-no-files-found: error
          retention-days: 14

  seal:
    if: inputs.scenario == ''
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - uses: actions/download-artifact@c850b930e6ba138125429b7e5c93fc707a7f8427
        with:
          pattern: command-center-release-slice-*-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification-slices
          merge-multiple: true

      - name: Seal coherent qualification receipt
        env:
          IMAGE: ghcr.io/ashleyhollis/openclaw@sha256:714d71199e498398a75e519b4ef3e19154eb48950a9185391b89aa34896d5980
          QUALIFICATION_SLICE_DIRECTORY: ${{ runner.temp }}/qualification-slices
          QUALIFICATION_OUTPUT_DIRECTORY: ${{ runner.temp }}/qualification
        run: node scripts/seal-release-qualification.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: command-center-release-qualification-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/qualification/receipt.json
          if-no-files-found: error
          retention-days: 14

      - name: Record qualification boundary
        run: |
          printf '%s\n' 'Coherent native release qualification passed on fresh prerequisite and performance workers for the exact source, plugin build, host receipt, image digest, browser and frozen performance baseline.' >> "$GITHUB_STEP_SUMMARY"
