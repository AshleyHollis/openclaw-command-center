name: Prepare release host receipt

on:
  workflow_call:
    inputs:
      harness_ref:
        required: true
        type: string
      image_digest:
        required: true
        type: string
      input_release:
        required: true
        type: string
      assembly_run_id:
        required: true
        type: string
      assembly_run_attempt:
        required: true
        type: string
      assembly_source_commit:
        required: true
        type: string
  # An immutable image must be explicitly selected by the existing collector.
  # The historical 9.5 push route had an implicit image and cannot select 9.9.
  workflow_dispatch:
    inputs:
      image_digest:
        description: Immutable ghcr.io/ashleyhollis/openclaw image digest
        required: true
        type: string
      native_archive_sha256:
        description: Collector-reviewed native archive SHA256 for this exact image and source
        required: true
        type: string

permissions:
  contents: read
  packages: read
  actions: read

concurrency:
  group: prepare-release-host-receipt-${{ github.ref }}
  cancel-in-progress: false

jobs:
  receipt:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Validate immutable selection
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          HARNESS_REF: ${{ inputs.harness_ref }}
          ASSEMBLY_RUN_ID: ${{ inputs.assembly_run_id }}
          ASSEMBLY_RUN_ATTEMPT: ${{ inputs.assembly_run_attempt }}
          ASSEMBLY_SOURCE_COMMIT: ${{ inputs.assembly_source_commit }}
          INPUT_RELEASE: ${{ inputs.input_release }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          if [ -n "$HARNESS_REF" ]; then
            [[ "$HARNESS_REF" =~ ^[a-f0-9]{40}$ ]]
            [[ "$ASSEMBLY_SOURCE_COMMIT" =~ ^[a-f0-9]{40}$ ]]
            [[ "$ASSEMBLY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$ASSEMBLY_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            test "$INPUT_RELEASE" = sealed-next2-7aaa-dc1-20261012
            test "$ASSEMBLY_RUN_ID" = "$GITHUB_RUN_ID"
            test "$ASSEMBLY_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
            test "$ASSEMBLY_SOURCE_COMMIT" = "$GITHUB_SHA"
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: inputs.harness_ref == ''
        with:
          persist-credentials: false

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        if: inputs.harness_ref != ''
        with:
          repository: AshleyHollis/openclaw-command-center
          ref: ${{ inputs.harness_ref }}
          persist-credentials: false

      - name: Bind reviewed harness checkout
        env:
          HARNESS_REF: ${{ inputs.harness_ref }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ -n "$HARNESS_REF" ]; then test "$actual" = "$HARNESS_REF"; else test "$actual" = "$GITHUB_SHA"; fi

      - name: Download same-run admitted inputs and pinned source bundle
        if: inputs.harness_ref != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE: ${{ inputs.input_release }}
          ASSEMBLY_RUN_ID: ${{ inputs.assembly_run_id }}
          ASSEMBLY_RUN_ATTEMPT: ${{ inputs.assembly_run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/next2-inputs" "$RUNNER_TEMP/next2-source"
          gh run download "$ASSEMBLY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "sealed-pair-assembly-next2-7aaa-dc1-20261012-$ASSEMBLY_RUN_ID-$ASSEMBLY_RUN_ATTEMPT" --dir "$RUNNER_TEMP/next2-inputs"
          gh release download "$INPUT_RELEASE" --repo "$GITHUB_REPOSITORY" --pattern native-next2-discord.bundle --dir "$RUNNER_TEMP/next2-source"
          test -f "$RUNNER_TEMP/next2-inputs/receipt.json"
          test -f "$RUNNER_TEMP/next2-inputs/reviewed-manifest.json"
          test -f "$RUNNER_TEMP/next2-inputs/workflow.json"
          test -f "$RUNNER_TEMP/next2-source/native-next2-discord.bundle"

      - name: Install pinned verifier runtime for Next2 preflight
        if: inputs.harness_ref != ''
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.21.0

      - name: Verify frozen native bundle and five retained input bytes
        if: inputs.harness_ref != ''
        env:
          ASSEMBLY_DIRECTORY: ${{ runner.temp }}/next2-inputs
          NATIVE_BUNDLE: ${{ runner.temp }}/next2-source/native-next2-discord.bundle
          ASSEMBLY_RUN_ID: ${{ inputs.assembly_run_id }}
          ASSEMBLY_RUN_ATTEMPT: ${{ inputs.assembly_run_attempt }}
          ASSEMBLY_SOURCE_COMMIT: ${{ inputs.assembly_source_commit }}
          HOST_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: node scripts/seal-next2-produced-host.mjs preflight

      - name: Resolve existing release metadata
        id: selection
        env:
          PREPARE_HOST_RECEIPT: '1'
          IMAGE_DIGEST: ${{ inputs.image_digest }}
          COMMAND_CENTER_NATIVE_PACKAGE_SHA256: ${{ inputs.harness_ref != '' && '248259c5a7cdab28954cfa292b18c87991743a81e3ddc41cf8206e96e86b19e2' || inputs.native_archive_sha256 }}
        run: node scripts/release-rehearsal-selection.mjs

      - name: Install supported verifier runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ steps.selection.outputs.node }}

      - name: Checkout exact OpenClaw source
        if: inputs.harness_ref == ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: AshleyHollis/openclaw
          ref: ${{ steps.selection.outputs.commit }}
          fetch-depth: 1
          persist-credentials: false
          path: _openclaw-source

      - name: Checkout public prerequisite for authenticated native source
        if: inputs.harness_ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: AshleyHollis/openclaw
          ref: 6f17361bd93a84978601eb4c884129ebd714a49b
          fetch-depth: 1
          persist-credentials: false
          path: _openclaw-source

      - name: Restore exact native source from pinned bundle
        if: inputs.harness_ref != ''
        run: node scripts/restore-next2-native-source.mjs "$RUNNER_TEMP/next2-source/native-next2-discord.bundle" "$GITHUB_WORKSPACE/_openclaw-source"

      - name: Install pinned verifier dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Materialize and verify packaged host
        env:
          IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          image="$IMAGE"
          docker pull "$image"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$image")" = "$OPENCLAW_COMMIT"
          test "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$image")" = "$OPENCLAW_VERSION"

          host="$RUNNER_TEMP/command-center-host"
          mkdir -p "$host/checkout" "$host/runtime" "$RUNNER_TEMP/receipt"
          tar --exclude=.git -C _openclaw-source -cf - . | tar --no-same-owner -C "$host/checkout" -xf -
          cp -a _openclaw-source/.git "$host/checkout/.git"
          git -C "$host/checkout" rev-parse HEAD | grep -Fx "$OPENCLAW_COMMIT"
          test -z "$(git -C "$host/checkout" status --porcelain --untracked-files=no)"

          git -C _openclaw-source archive --format=tar "$OPENCLAW_COMMIT" > "$RUNNER_TEMP/openclaw-source.tar"
          printf 'sha256:%s\n' "$(sha256sum "$RUNNER_TEMP/openclaw-source.tar" | cut -d ' ' -f 1)" > "$RUNNER_TEMP/source-digest.txt"

          container="$(docker create "$image")"
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker cp "$container:/app/." "$host/runtime"
          docker rm "$container" >/dev/null
          trap - EXIT
          sudo chown -R "$(id -u):$(id -g)" "$host"

          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile, writeFile } from 'node:fs/promises';
          import path from 'node:path';
          import { parseHostDescriptor, pinnedHost, verifyHost } from './src/host-harness.mjs';
          import { packagedHostDigest } from './src/packaged-host-integrity.mjs';

          const digest = bytes => `sha256:${createHash('sha256').update(bytes).digest('hex')}`;
          const host = path.join(process.env.RUNNER_TEMP, 'command-center-host');
          const checkout = path.join(host, 'checkout');
          const runtimeRoot = path.join(host, 'runtime');
          const sourceDigest = (await readFile(path.join(process.env.RUNNER_TEMP, 'source-digest.txt'), 'utf8')).trim();
          const executableDigest = digest(await readFile(path.join(runtimeRoot, 'node_modules/openclaw/openclaw.mjs')));
          const contract = JSON.parse(await readFile('src/runtime-capability.json', 'utf8'));
          const contractDigest = digest(Buffer.from(JSON.stringify(contract)));
          const runtimeDigest = await packagedHostDigest(runtimeRoot);
          const receipt = {
            schemaVersion: 2,
            sourceDigest,
            commit: pinnedHost.commit,
            executableDigest,
            contractDigest,
            packageDigest: pinnedHost.packageDigest,
            runtimeDigest
          };
          await writeFile(path.join(host, 'receipt.json'), `${JSON.stringify(receipt)}\n`, { mode: 0o400 });
          const descriptor = {
            schemaVersion: 2,
            checkout,
            runtimeRoot,
            commit: pinnedHost.commit,
            command: { executable: 'node_modules/openclaw/openclaw.mjs', args: pinnedHost.args },
            integrity: receipt
          };
          await verifyHost(parseHostDescriptor(JSON.stringify(descriptor)));
          await writeFile(path.join(process.env.RUNNER_TEMP, 'receipt', 'host-receipt.json'), `${JSON.stringify(receipt, null, 2)}\n`);
          await writeFile(path.join(process.env.RUNNER_TEMP, 'receipt', 'provenance.json'), `${JSON.stringify({
            schemaVersion: 1,
            image: `ghcr.io/ashleyhollis/openclaw@${process.env.IMAGE_DIGEST}`,
            sourceCommit: process.env.OPENCLAW_COMMIT,
            hostVersion: process.env.OPENCLAW_VERSION,
            receipt
          }, null, 2)}\n`);
          NODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.harness_ref == ''
        with:
          name: command-center-host-receipt-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/receipt
          if-no-files-found: error
          retention-days: 14

      - name: Bind actual produced installed host and seal package selection
        if: inputs.harness_ref != ''
        env:
          ASSEMBLY_DIRECTORY: ${{ runner.temp }}/next2-inputs
          NATIVE_BUNDLE: ${{ runner.temp }}/next2-source/native-next2-discord.bundle
          IDENTITY_FILE: ${{ runner.temp }}/receipt/candidate-qualification-identity.json
          PROVENANCE_FILE: ${{ runner.temp }}/receipt/provenance.json
          FINAL_DIRECTORY: ${{ runner.temp }}/next2-final
          FINAL_ARTIFACT_NAME: sealed-pair-next2-7aaa-dc1-20261012-${{ inputs.assembly_run_id }}-${{ inputs.assembly_run_attempt }}
          ASSEMBLY_RUN_ID: ${{ inputs.assembly_run_id }}
          ASSEMBLY_RUN_ATTEMPT: ${{ inputs.assembly_run_attempt }}
          ASSEMBLY_SOURCE_COMMIT: ${{ inputs.assembly_source_commit }}
          HOST_IMAGE_DIGEST: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          node scripts/bind-produced-performance-host.mjs \
            "$ASSEMBLY_DIRECTORY/openclaw-current.tgz" "$ASSEMBLY_DIRECTORY/package-candidate.json" \
            "$ASSEMBLY_DIRECTORY/command-center.tgz" "$ASSEMBLY_DIRECTORY/command-center-receipt.json" \
            "$PROVENANCE_FILE" "$RUNNER_TEMP/command-center-host/runtime" \
            "$GITHUB_WORKSPACE/_openclaw-source" "$IDENTITY_FILE"
          mv "$PROVENANCE_FILE" "$RUNNER_TEMP/receipt/host-provenance.json"
          printf 'PROVENANCE_FILE=%s\n' "$RUNNER_TEMP/receipt/host-provenance.json" >> "$GITHUB_ENV"
          PROVENANCE_FILE="$RUNNER_TEMP/receipt/host-provenance.json" node scripts/seal-next2-produced-host.mjs

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: inputs.harness_ref != ''
        with:
          name: sealed-pair-next2-7aaa-dc1-20261012-${{ inputs.assembly_run_id }}-${{ inputs.assembly_run_attempt }}
          path: ${{ runner.temp }}/next2-final
          if-no-files-found: error
          retention-days: 14

      - name: Record receipt boundary
        run: |
          printf '%s\n' 'Verified packaged-host receipt only. Real-host acceptance, performance capture, migration/restore rehearsal and deployment remain required.' >> "$GITHUB_STEP_SUMMARY"
