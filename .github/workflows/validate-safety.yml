name: Validate repository safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/safety.test.mjs
      - run: npx playwright install --with-deps chromium
      - name: Topic reader regression
        env:
          COMMAND_CENTER_VISUAL_OUTPUT: ${{ runner.temp }}/topic-reader-tables.png
        run: node --test test/native-reader-tables.test.mjs test/note-render.test.mjs test/native-reader-workspace.test.mjs test/native-document-preview.test.mjs test/native-ui-navigation.test.mjs test/mutation-architecture.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: topic-reader-fictional-ui
          path: ${{ runner.temp }}/topic-reader-tables.png
          if-no-files-found: error
          retention-days: 14
      - run: npm run check
