name: Validate repository safety

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  safety:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.12.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test test/safety.test.mjs
      - run: node --test test/mutation-architecture.test.mjs test/native-attachment-selection.test.mjs test/topic-document-filing-review.test.mjs test/topic-document-filing-intent.test.mjs
      - run: node --test --test-name-pattern='attachment review actions' test/topic-page-http.test.mjs
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: node --test test/native-ui-topic-attachment-review.test.mjs test/native-ui-page.test.mjs
